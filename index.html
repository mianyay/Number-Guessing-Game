<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url(images/bg.jpg);
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="playagainbtn" aria-label="Play again">
            <img src="images/redo.png" alt="redo">
        </button>
        <h1>Number Guessing Game</h1>
        <div class="game">
            <div class="range">
                <label>From <input type="number" id="min-input" value="1"></label>
                <label>To <input type="number" id="max-input" value="100"></label>
            </div>
            <p id="prompt">Guess a number 1 - 100</p>
            <input type="number" id="guess">
            <button id="guess-btn">Guess</button>
            <p id="result"></p>
            <p id="attempts">Attempts: 0</p>
            <p id="highscore">Highscore:</p>
            <div id="history"></div>
            
        </div>
    </div>
    <div id="confetti"></div>
    <script src="script.js"></script>
</body>
</html>
